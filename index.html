<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopEase FAQ Assistant</title>
<style>
body{font-family:system-ui,sans-serif;background:#f3f4f6;margin:0;display:flex;justify-content:center}
.chat{width:100%;max-width:640px;height:100vh;display:flex;flex-direction:column;background:#fff}
header{background:#2563eb;color:#fff;padding:14px 18px;font-weight:600}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:80%;padding:10px 14px;border-radius:14px;line-height:1.4}
.u{align-self:flex-end;background:#2563eb;color:#fff}
.b{align-self:flex-start;background:#e5e7eb}
.meta{font-size:12px;color:#555;margin-top:6px}
.chip{display:inline-block;margin:4px 4px 0 0;padding:4px 10px;border:1px solid #2563eb;color:#2563eb;border-radius:999px;font-size:12px;cursor:pointer;background:#fff}
form{display:flex;gap:8px;padding:12px;border-top:1px solid #ddd}
input{flex:1;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:15px}
button{padding:10px 16px;border:0;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer}
</style></head><body>
<div class="chat">
<header>ShopEase FAQ Assistant</header>
<div id="log"></div>
<form id="f"><input id="q" placeholder="Ask about orders, refunds, payments..." autocomplete="off"><button>Send</button></form>
</div>
<script>
const log=document.getElementById('log'),q=document.getElementById('q');
function add(text,cls){const d=document.createElement('div');d.className='m '+cls;d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
async function ask(text){
  add(text,'u');
  const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:text})});
  const d=await r.json();
  const el=add(d.answer,'b');
  const meta=document.createElement('div');meta.className='meta';
  if(d.matched){meta.textContent=`${d.category} · confidence ${(d.confidence*100).toFixed(0)}% · Was this helpful? `;
    ['👍','👎'].forEach((e,i)=>{const s=document.createElement('span');s.textContent=e+' ';s.style.cursor='pointer';
      s.onclick=()=>{fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:text,helpful:i==0})});meta.textContent='Thanks for your feedback!'};meta.appendChild(s)})}
  el.appendChild(meta);
  (d.suggestions||[]).forEach(s=>{const c=document.createElement('span');c.className='chip';c.textContent=s;c.onclick=()=>ask(s);el.appendChild(c)});
}
document.getElementById('f').onsubmit=e=>{e.preventDefault();const t=q.value.trim();if(t){q.value='';ask(t)}};
add('Hi! I am the ShopEase assistant. Ask me about orders, shipping, returns, payments or your account.','b');
</script></body></html>
